[build]
  command = "npm run build"
  publish = "dist"

# Fallback SPA: rutas como /video/9 no son archivos reales; deben servir
# index.html para que React Router las resuelva. Netlify NO hace esto solo
# (a diferencia de Vercel), así que sin esta regla darían 404 al entrar directo.
# force = false (por defecto) => los archivos reales se sirven antes que esta regla.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de seguridad (portados de vercel.json). CSP estricta sin
# 'unsafe-inline' en script-src: el build no genera scripts inline.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"

# Videos: caché inmutable de 1 año + soporte de rango (scrub del reproductor).
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Accept-Ranges = "bytes"

# Assets con hash en el nombre: caché inmutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
